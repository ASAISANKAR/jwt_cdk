<!DOCTYPE html>
<html>
<head>
    <title>Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        h1 {
            font-size: 60px;
            color: #ff6b6b;
        }
        p {
            font-size: 20px;
            color: #555;
        }
        a {
            text-decoration: none;
            color: white;
            background: #007bff;
            padding: 10px 20px;
            border-radius: 5px;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
<h1>404</h1>
<p>Oops! Page not found.</p>
<p>The page you are looking for doesn't exist.</p>
<a href="/">Go Home</a>
</body>
</html>
